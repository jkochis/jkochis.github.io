<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>JEH</title>
  <style>
    .typewriter-container {
        background-color: #1a1a1a; /* Almost black background */
        color: #f8f8f8; /* Almost white text */
        font-family: 'Courier New', monospace; /* Typewriter font */
        padding: 20px;
        text-align: center;
        border-radius: 5px;
        margin: 20px 0;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
    }

    .typewriter-text {
        font-size: 18px;
        letter-spacing: 2px;
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid #f8f8f8;
        animation: typewriter 3s steps(18, end) forwards, blink-caret 0.5s step-end infinite;
    }

    @keyframes typewriter {
        from {
            width: 0;
        }
        to {
            width: 100%;
        }
    }

    @keyframes blink-caret {
        from, to {
            border-color: transparent;
        }
        50% {
            border-color: #f8f8f8;
        }
    }
  </style>
</head>
<body>
  <div class="typewriter-container">
    <div class="typewriter-text">if you know, you know</div>
  </div>
</body>
</html>
